name: Audit Hertsovagen exact location patterns
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/audit_lulea_hertsovagen_c4_exact_patterns.py
      - .github/workflows/audit-hertsovagen-exact-patterns.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/audit_lulea_hertsovagen_c4_exact_patterns.py
      - uses: actions/upload-artifact@v4
        with:
          name: hertsovagen-c4-exact-patterns
          path: data/audit_lulea_hertsovagen_c4_exact_patterns.csv
          if-no-files-found: error
