name: QA GIS street-name matches
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/audit_lulea_gis_road_match_qa.py
      - .github/workflows/qa-lulea-gis-road-matches.yml
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/audit_lulea_gis_road_match_qa.py
      - uses: actions/upload-artifact@v4
        with:
          name: lulea-gis-road-match-qa
          path: |
            data/audit_lulea_gis_road_match_qa.csv
            data/audit_lulea_gis_road_priority.csv
          if-no-files-found: error
