name: Publish preliminary Lulea transport data
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/lulea-transport-menu-release-20261022
    paths:
      - docs/lulea.html
      - scripts/build_transport_categories.py
      - scripts/police_publication_dedup.py
      - data/events.csv
      - .github/workflows/publish-lulea-transport-preliminary.yml
  schedule:
    - cron: '40 9 * * *'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate preliminary transport dataset
        run: python scripts/build_transport_categories.py
      - name: Verify candidate counts and filter schema
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          path=Path("docs/data/lulea_transport_monthly.csv")
          rows=list(csv.DictReader(path.open(encoding="utf-8")))
          required={"year","month","geography_group","road_reference","junction_reference","transport_mode","event_kind","event_count"}
          assert rows and required <= set(rows[0]), "Transport schema missing"
          assert all(int(r["event_count"])>0 for r in rows)
          assert 'id="transportMode"' in Path("docs/lulea.html").read_text(encoding="utf-8")
          print("Validated transport aggregate:",len(rows),"rows")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: preliminary-lulea-transport-data
          path: docs/data/lulea_transport_monthly.csv
      - name: Publish data on main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/lulea_transport_monthly.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update preliminary Lulea transport dataset"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
