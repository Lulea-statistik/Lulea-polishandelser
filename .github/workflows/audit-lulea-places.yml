name: Audit Lulea place mentions
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/audit_lulea_places.py"
      - "scripts/audit_lulea_unknown.py"
      - "scripts/build_lulea_districts.py"
      - ".github/workflows/audit-lulea-places.yml"
permissions:
  contents: write
concurrency:
  group: audit-lulea-place-mentions
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/audit_lulea_places.py
      - run: python scripts/audit_lulea_unknown.py
      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audit_lulea_place_mentions.csv data/audit_lulea_place_summary.csv data/audit_lulea_unknown_candidates.csv data/audit_lulea_unknown_summary.csv data/audit_lulea_unknown_examples.csv data/audit_lulea_unknown_geographic_names.csv
          if ! git diff --cached --quiet; then
            git commit -m "Auditera platsnamn i Luleas polishandelser"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
