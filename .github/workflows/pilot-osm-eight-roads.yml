name: Pilot OSM eight road geometries
on:
  workflow_dispatch:
    inputs:
      road:
        description: 'Välj en väg att hämta (eller alla)'
        type: choice
        required: true
        default: 'Älvbrovägen'
        options:
          - Älvbrovägen
          - Hertsövägen
          - Haparandavägen
          - Storhedsvägen
          - Mariebergsvägen
          - Mjölkuddsvägen
          - Storsandsvägen
          - Väderleden
          - Alla
  push:
    paths:
      - scripts/fetch_osm_lulea_eight_road_pilot.py
      - .github/workflows/pilot-osm-eight-roads.yml
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - road: Hertsövägen
            number: 1
          - road: Älvbrovägen
            number: 2
          - road: Haparandavägen
            number: 3
          - road: Storhedsvägen
            number: 4
          - road: Mariebergsvägen
            number: 5
          - road: Mjölkuddsvägen
            number: 6
          - road: Storsandsvägen
            number: 7
          - road: Väderleden
            number: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch one OSM road
        if: github.event_name != 'workflow_dispatch' || inputs.road == 'Alla' || inputs.road == matrix.road
        run: python scripts/fetch_osm_lulea_eight_road_pilot.py --road "${{ matrix.road }}"
      - uses: actions/upload-artifact@v4
        if: success() && (github.event_name != 'workflow_dispatch' || inputs.road == 'Alla' || inputs.road == matrix.road)
        with:
          name: osm-lulea-road-${{ matrix.number }}
          path: data/gis/osm_lulea_${{ matrix.number }}_road_candidates.geojson
          if-no-files-found: error
