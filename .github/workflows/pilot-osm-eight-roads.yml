name: Pilot OSM eight road geometries
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/fetch_osm_lulea_eight_road_pilot.py
      - .github/workflows/pilot-osm-eight-roads.yml
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fetch_osm_lulea_eight_road_pilot.py
      - uses: actions/upload-artifact@v4
        with:
          name: osm-lulea-eight-road-candidates
          path: data/gis/osm_lulea_eight_road_candidates.geojson
          if-no-files-found: error
