name: Reclassify geography

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reclassify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/reclassify.py
      - name: Sync dashboard data
        run: |
          mkdir -p docs/data
          cp data/monthly_summary.csv docs/data/monthly_summary.csv
      - name: Commit corrected geography
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.csv data/monthly_summary.csv docs/data/monthly_summary.csv
          if git diff --cached --quiet; then
            echo "No geography changes"
          else
            git commit -m "Korrigera geografisk klassificering"
            git push
          fi
