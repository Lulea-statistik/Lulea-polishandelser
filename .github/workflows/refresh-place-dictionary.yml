name: Refresh Norrbotten place dictionary

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_norrbotten_place_dictionary.py"
      - ".github/workflows/refresh-place-dictionary.yml"

permissions:
  contents: write

concurrency:
  group: refresh-norrbotten-place-dictionary
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/build_norrbotten_place_dictionary.py
      - name: Commit dictionary if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/norrbotten_place_to_municipality.csv /tmp/norrbotten_place_to_municipality.csv
          git fetch origin main
          git reset --hard origin/main
          mkdir -p data
          cp /tmp/norrbotten_place_to_municipality.csv data/norrbotten_place_to_municipality.csv
          git add data/norrbotten_place_to_municipality.csv
          if git diff --cached --quiet; then
            echo "No place dictionary changes"
          else
            git commit -m "Uppdatera ort-till-kommunreferens"
            git push origin HEAD:main
          fi
