name: Fetch SCB Lulea DeSO 2025
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/fetch_scb_deso_2025_lulea.py
      - .github/workflows/fetch-scb-lulea-deso.yml
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fetch_scb_deso_2025_lulea.py
      - uses: actions/upload-artifact@v4
        with:
          name: scb-lulea-deso-2025-geojson
          path: data/gis/scb_deso_2025_lulea.geojson
          if-no-files-found: error
