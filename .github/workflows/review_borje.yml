name: Review Borje source texts

on:
  push:
    branches: [main]
    paths:
      - "scripts/review_borje.py"
      - ".github/workflows/review_borje.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/review_borje.py
      - name: Save review extracts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/review_borje_full_text.csv data/review_borje_patterns.csv
          if ! git diff --cached --quiet; then
            git commit -m "Save Börje full-text investigation extracts"
            git pull --rebase origin main
            git push
          fi
