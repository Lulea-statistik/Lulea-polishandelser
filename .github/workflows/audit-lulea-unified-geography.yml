name: Audit unified Lulea geography preview
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/audit_lulea_unified_geography_preview.py
      - .github/workflows/audit-lulea-unified-geography.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/audit_lulea_unified_geography_preview.py
      - uses: actions/upload-artifact@v4
        with:
          name: lulea-unified-geography-preview
          path: data/audit_lulea_unified_geography_preview.csv
          if-no-files-found: error
