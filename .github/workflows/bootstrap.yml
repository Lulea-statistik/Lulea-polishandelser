name: Bootstrap polishandelser

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/bootstrap.py
      - run: python scripts/extract_summary_details.py
      - name: Sync dashboard data
        run: |
          mkdir -p docs/data
          cp data/monthly_summary.csv docs/data/monthly_summary.csv
          cp data/summary_details_monthly.csv docs/data/summary_details_monthly.csv
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data/monthly_summary.csv docs/data/summary_details_monthly.csv
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Bootstrap polishändelser"
            git push
          fi
