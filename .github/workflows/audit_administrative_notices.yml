name: Audit administrative notice exclusions

on:
  push:
    branches: [main]
    paths:
      - "scripts/audit_administrative_notices.py"
      - ".github/workflows/audit_administrative_notices.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/audit_administrative_notices.py
      - name: Store review output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/excluded_administrative_review_full_text.csv data/included_administrative_review_candidates.csv data/administrative_review_stats.csv
          if ! git diff --cached --quiet; then
            git commit -m "Add audit evidence for administrative notices"
            git pull --rebase origin main
            git push
          fi
