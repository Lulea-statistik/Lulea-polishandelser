name: Probe Sveriges Radio VMA API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/probe_sr_vma.py"
      - ".github/workflows/probe_sr_vma.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/probe_sr_vma.py
      - name: Save diagnostic results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sr_vma_api_probe.csv
          if ! git diff --cached --quiet; then
            git commit -m "Record Sveriges Radio VMA API availability"
            git pull --rebase origin main
            git push
          fi
