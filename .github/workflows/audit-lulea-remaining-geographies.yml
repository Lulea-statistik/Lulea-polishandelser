name: Audit remaining Lulea geographies
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/audit_lulea_remaining_geographies.py
      - scripts/build_lulea_districts.py
      - scripts/test_lulea_exact_localities.py
      - .github/workflows/audit-lulea-remaining-geographies.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/test_lulea_exact_localities.py
      - name: Save baseline and rebuild locally
        run: |
          mkdir -p audit-output/before
          cp docs/data/lulea_district*monthly.csv audit-output/before/
          python scripts/build_lulea_districts.py
          python scripts/build_lulea_districts_expanded.py
          python - <<'PY'
          import csv
          from collections import Counter
          from pathlib import Path
          for before in Path("audit-output/before").glob("*.csv"):
              def counts(path):
                  with path.open(encoding="utf-8-sig") as f:
                      c=Counter()
                      for r in csv.DictReader(f):
                          c[r["geography_group"]]+=int(r["event_count"])
                      return c
              old=counts(before)
              new=counts(Path("docs/data")/before.name)
              assert sum(old.values())==sum(new.values()), "Total changed"
              delta=old["Okänt delområde"]-new["Okänt delområde"]
              assert delta>=0
              assert all(new[k]==v for k,v in old.items() if k!="Okänt delområde" and k not in ("Kallax","Rutvik","Bensbyn","Bälinge","Klöverträsk","Brändön","Avan","Sundom","Persön")), "Existing area changed"
              line=f"{before.name}: unknown {old['Okänt delområde']} -> {new['Okänt delområde']}; improvement {delta}; total {sum(new.values())}; new areas {dict(new-old)}"
              print(line)
              with Path("audit-output/before-after.txt").open("a",encoding="utf-8") as f:f.write(line+"\n")
          PY
      - run: python scripts/audit_lulea_remaining_geographies.py
      - run: cat audit-output/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: remaining-lulea-geography-audit
          path: audit-output/
          retention-days: 14
