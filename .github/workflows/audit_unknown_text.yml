name: Audit unknown municipality text

on:
  push:
    branches: [main]
    paths:
      - "scripts/audit_unknown_text_precision.py"
      - ".github/workflows/audit_unknown_text.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/audit_unknown_text_precision.py
      - name: Save review queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/unknown_municipality_text_review.csv data/unknown_municipality_text_review_stats.csv
          if ! git diff --cached --quiet; then
            git commit -m "Audit precision-first unknown municipality candidates"
            git pull --rebase origin main
            git push
          fi
