name: Audit unknown named roads
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/audit_lulea_unknown_road_names.py
      - .github/workflows/audit-lulea-unknown-roads.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/audit_lulea_unknown_road_names.py
      - uses: actions/upload-artifact@v4
        with:
          name: lulea-unknown-road-candidates
          path: |
            data/audit_lulea_unknown_road_names.csv
            data/audit_lulea_gis_road_numbers.csv
          if-no-files-found: error
