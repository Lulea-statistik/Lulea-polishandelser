name: Update polishandelser
# QA rerun marker

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_latest.py"
      - "scripts/common.py"
      - "scripts/extract_summary_details.py"
      - "scripts/deduplicate_summary_details.py"
      - "scripts/build_expanded_monthly.py"
      - "scripts/audit_unresolved_summaries.py"
      - "scripts/build_summary_validation_sample.py"
      - "scripts/build_summary_validation_review.py"
      - "scripts/build_summary_validation_misses.py"
      - "scripts/revise_summary_validation_event_definition.py"
      - "scripts/annotate_summary_validation_batch6.py"
      - "scripts/report_summary_validation.py"
      - ".github/workflows/update.yml"
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: update-polishandelser
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/update_latest.py
      - run: python scripts/extract_summary_details.py
      - run: python scripts/deduplicate_summary_details.py
      - run: python scripts/build_expanded_monthly.py
      - run: python scripts/audit_unresolved_summaries.py
      - run: python scripts/build_summary_validation_sample.py
      - run: python scripts/annotate_summary_validation_batch1.py
      - run: python scripts/annotate_summary_validation_batch2.py
      - run: python scripts/annotate_summary_validation_batch3.py
      - run: python scripts/annotate_summary_validation_batch4.py
      - run: python scripts/annotate_summary_validation_batch5.py
      - run: python scripts/annotate_summary_validation_batch6.py
      - run: python scripts/revise_summary_validation_event_definition.py
      - run: python scripts/build_summary_validation_review.py
      - run: python scripts/build_summary_validation_remaining.py
      - run: python scripts/build_summary_validation_misses.py
      - run: python scripts/report_summary_validation.py
      - name: Sync dashboard data
        run: |
          mkdir -p docs/data
          cp data/monthly_summary.csv docs/data/monthly_summary.csv
          cp data/summary_details_monthly.csv docs/data/summary_details_monthly.csv
          cp data/summary_details_extra_monthly.csv docs/data/summary_details_extra_monthly.csv
          cp data/expanded_monthly_summary.csv docs/data/expanded_monthly_summary.csv
          cp data/quiet_summaries_monthly.csv docs/data/quiet_summaries_monthly.csv
      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data/monthly_summary.csv docs/data/summary_details_monthly.csv docs/data/summary_details_extra_monthly.csv docs/data/expanded_monthly_summary.csv docs/data/quiet_summaries_monthly.csv
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git fetch origin main
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              echo "Run is stale because main changed during execution; skip data push."
              exit 0
            fi
            git commit -m "Uppdatera polishändelser"
            git push origin HEAD:main
          fi
