name: Probe Krisinformation historical news

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/probe_krisinformation.py"
      - ".github/workflows/probe_krisinformation.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe news for Norrbotten
        run: python scripts/probe_krisinformation.py
      - name: Commit diagnostic results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/krisinformation_api_probe.csv data/krisinformation_norrbotten_candidate.csv || true
          if ! git diff --cached --quiet; then
            git commit -m "Record Krisinformation historical API coverage probe"
            git pull --rebase origin main
            git push
          fi
