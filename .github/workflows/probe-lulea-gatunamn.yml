name: Probe Lulea GIS Gatunamn
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/probe_lulea_gatunamn_arcgis.py
      - .github/workflows/probe-lulea-gatunamn.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/probe_lulea_gatunamn_arcgis.py
