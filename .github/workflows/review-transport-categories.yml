name: Review Lulea transport categories
on:
  workflow_dispatch:
  schedule:
    - cron: '25 9 * * *'
  push:
    branches:
      - feature/transport-categories-20261022
      - main
    paths:
      - scripts/build_transport_categories.py
      - .github/workflows/review-transport-categories.yml
      - docs/transport.html
      - data/events.csv
jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build transport candidates
        run: python scripts/build_transport_categories.py
      - name: Upload review datasets
        uses: actions/upload-artifact@v4
        with:
          name: transport-review-datasets
          path: |
            data/audit_lulea_transport_candidates.csv
            docs/data/lulea_transport_monthly.csv
      - name: Publish monthly dataset on main only
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/lulea_transport_monthly.csv
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Lulea transport aggregate"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
