name: Review Lulea transport categories
on:
  workflow_dispatch:
  push:
    branches:
      - feature/transport-categories-20261022
    paths:
      - scripts/build_transport_categories.py
      - .github/workflows/review-transport-categories.yml
      - docs/transport.html
jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build transport candidates
        run: python scripts/build_transport_categories.py
      - name: Upload review datasets
        uses: actions/upload-artifact@v4
        with:
          name: transport-review-datasets
          path: |
            data/audit_lulea_transport_candidates.csv
            docs/data/lulea_transport_monthly.csv
