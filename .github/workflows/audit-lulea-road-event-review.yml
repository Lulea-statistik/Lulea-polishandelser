name: Audit Lulea road event review queue
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/audit_lulea_road_event_review_queue.py
      - .github/workflows/audit-lulea-road-event-review.yml
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/audit_lulea_own_place_road_qa.py
      - run: python scripts/audit_lulea_own_place_deso_pilot.py
      - run: python scripts/audit_lulea_road_event_review_queue.py
      - uses: actions/upload-artifact@v4
        with:
          name: lulea-road-event-review-queue
          path: |
            data/audit_lulea_road_event_review_queue.csv
            data/audit_lulea_road_p1_evidence.json
          if-no-files-found: error
