name: Audit Hertsovagen road cases
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/audit_lulea_hertsovagen_case_review.py
      - .github/workflows/audit-hertsovagen-cases.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/audit_lulea_hertsovagen_case_review.py
      - uses: actions/upload-artifact@v4
        with:
          name: hertsovagen-73-cases
          path: data/audit_lulea_hertsovagen_case_review.csv
          if-no-files-found: error
