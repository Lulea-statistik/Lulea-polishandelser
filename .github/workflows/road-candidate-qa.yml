name: Road candidate quality control
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/audit_all_road_candidates.py'
      - 'tests/test_audit_all_road_candidates.py'
      - '.github/workflows/road-candidate-qa.yml'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_audit_all_road_candidates.py
      - run: python scripts/audit_lulea_own_place_road_qa.py
      - run: python scripts/audit_all_road_candidates.py
      - uses: actions/upload-artifact@v4
        with:
          name: road-candidate-quality-review
          path: data/audit_all_road_candidate_decisions.csv
          if-no-files-found: error
